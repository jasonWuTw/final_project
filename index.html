<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>作品集入口網頁</title>
    <!-- 引入 Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- 引入 Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

    <style>
        /* 1. 色彩豐富的背景漸層：取代原本蒼白的單色背景 */
        body {
            background: linear-gradient(135deg, #ffecd2 0%, #fcb69f 100%);
            /* 換成溫暖、生活化的蜜桃陽光配色 */
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* 2. 卡片懸停微互動：創造立體感與可點擊的暗示 */
        .hover-card {
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .hover-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 1.5rem 3rem rgba(0, 0, 0, .15) !important;
        }

        /* 3. 頭像凸出設計：打破四四方方的卡片框架 */
        .avatar-wrapper {
            margin-top: -65px;
            /* 讓頭像往上移，超出卡片邊界 */
            text-align: center;
        }

        .avatar-img {
            width: 130px;
            height: 130px;
            object-fit: cover;
            border: 6px solid #ffffff;
            /* 粗白邊框讓頭像更突出 */
            background-color: #ffffff;
        }

        /* 裝飾性背景圖形 */
        .bg-shape {
            position: absolute;
            top: -10%;
            left: -10%;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.25) 0%, rgba(255, 255, 255, 0) 70%);
            border-radius: 50%;
            z-index: -1;
        }
    </style>
</head>

<body class="min-vh-100 d-flex flex-column position-relative z-0 overflow-hidden">

    <!-- 裝飾背景 -->
    <div class="bg-shape"></div>

    <!-- 頁首標題區塊 -->
    <header class="text-center pt-5 pb-3">
        <p class="text-uppercase tracking-wider text-muted fw-bold mb-2" style="letter-spacing: 2px;">Web Design Project
        </p>
        <h1 class="display-5 fw-bolder text-dark">探索我們的個人網站</h1>
    </header>

    <!-- 主要內容區：利用 Flexbox 垂直水平置中 -->
    <main class="flex-grow-1 d-flex align-items-center pb-5">
        <div class="container">
            <!-- row 搭配 g-5 (gap) 設定欄位間距，在大螢幕並排，小螢幕自動堆疊 -->
            <div class="row g-5 justify-content-center mt-3">

                <!-- 同學 A 卡片 -->
                <div class="col-md-8 col-lg-5 col-xl-4">
                    <!-- 使用 BS5 圓角 (rounded-5) 與陰影 (shadow) -->
                    <div class="card h-100 border-0 rounded-5 shadow hover-card mt-4">
                        <div class="avatar-wrapper">
                            <!-- 使用時尚流行的 micah 風格頭像 -->
                            <img src="https://api.dicebear.com/7.x/micah/svg?seed=Chloe&backgroundColor=ffd1dc"
                                class="avatar-img rounded-circle shadow-sm" alt="同學 A 的頭像">
                        </div>
                        <div class="card-body d-flex flex-column text-center p-4 p-lg-5">
                            <h2 class="fw-bold mb-1">林小雅</h2>
                            <p class="text-primary fw-medium mb-3">視覺設計 / 前端開發</p>
                            <p class="text-muted mb-4 flex-grow-1">
                                "熱愛探索色彩與排版的無限可能，致力於打造兼具美感與實用性的網頁介面。"
                            </p>
                            <!-- 互動按鈕 -->
                            <a href="#" class="btn btn-outline-dark rounded-pill py-2 px-4 fw-bold">
                                <i class="bi bi-browser-edge me-2"></i> 參觀個人網站
                            </a>
                        </div>
                    </div>
                </div>

                <!-- 同學 B 卡片 -->
                <div class="col-md-8 col-lg-5 col-xl-4">
                    <div class="card h-100 border-0 rounded-5 shadow hover-card mt-4">
                        <div class="avatar-wrapper">
                            <img src="https://api.dicebear.com/7.x/notionists/svg?seed=Felix&backgroundColor=c0aede"
                                class="avatar-img rounded-circle shadow-sm" alt="同學 B 的頭像">
                        </div>
                        <div class="card-body d-flex flex-column text-center p-4 p-lg-5">
                            <h2 class="fw-bold mb-1">吳忠雄</h2>
                            <p class="text-primary fw-medium mb-3">AI Architect</p>
                            <p class="text-muted mb-4 flex-grow-1">
                                "專注於AI系統架構與效能優化，致力於打造堅固可靠的AI應用。"
                            </p>
                            <a href="514230149/514230149.html" class="btn btn-outline-dark rounded-pill py-2 px-4 fw-bold">
                                <i class="bi bi-browser-edge me-2"></i> 參觀個人網站
                            </a>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </main>

    <footer class="text-center py-3 text-muted small">
        &copy; 2026 期末專題
    </footer>

    <!-- 引入 Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.css"></script>
</body>

</html>
